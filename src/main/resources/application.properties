#NAME OF THE APPLICATION
spring.application.name=auth

#SERVLET PATH
server.error.include-stacktrace=never
server.servlet.context-path=/auth

#PORT
server.port=8084

#JWT SECRET TO GENERATE TOKEN
#Credential material: supplied by a Kubernetes Secret in the cluster.
#The default exists only so a local run works without setup.
jwt.secret=${JWT_SECRET:sample-secret-key}
jwt.expirationTime=86400
security.authentication.jwt.secret.token-validity-in-seconds: 86400

#H2 DB CONFIGURATION
spring.datasource.url=jdbc:h2:mem:auth-ms
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.username=root
spring.datasource.password=root
spring.sql.init.mode=always
#Boot 2.5+ runs data.sql BEFORE Hibernate creates tables; defer it so seed
#data lands after ddl-auto. Without this the app compiles but dies on startup.
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
# spring.h2.console.enabled=true

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.hbm2ddl-auto=update

# Spring Framework and application log
logging.level.org.springframework=info
# Hibernate logs for displaying executed SQL, input and output	
logging.level.org.hibernate.SQL=trace
logging.level.org.hibernate.type.descriptor.sql=trace

# Log pattern
logging.pattern.console=%d{dd-MM-yy} %d{HH:mm:ss.SSS} %-20.20thread %5p %-25.25logger{25} %25M %4L %m%n

spring.jackson.default-property-inclusion=non-null

#ACTUATOR - kubernetes liveness/readiness probes
#Served under the context path: /authentication/actuator/health/{liveness,readiness}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
